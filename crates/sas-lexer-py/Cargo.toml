[package]
name = "sas-lexer-py"
description = "Python bindings for sas-lexer crate."
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
# PyO3 0.30 requires Rust 1.85. This crate is private (publish = false), so it does not
# constrain the public crates, which keep the workspace MSRV.
rust-version = "1.85"
version = "1.0.0-beta.2"
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
publish = false

[lib]
name = "_sas_lexer_rust"
crate-type = ["cdylib"]


[dependencies]
pyo3 = "0.30.1"
rmp-serde = { workspace = true }
sas-lexer = { version = "1.0.0-beta.4", features = ["serde", "macro_sep"] }
serde_bytes = "0.11.15"

[build-dependencies]
anyhow = "1.0.91"
sas-lexer = { version = "1.0.0-beta.4", features = ["serde", "macro_sep"] }
strum = { workspace = true }
convert_case = "0.6.0"

[lints]
workspace = true
