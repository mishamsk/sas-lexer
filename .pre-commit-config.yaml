default_install_hook_types:
  - pre-commit
  - pre-push
exclude: ".*\\.sas$|.*\\.snap$"
repos:
  # General hooks
  - repo: builtin
    hooks:
      - id: check-json
        exclude: ^.vscode/.*$
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
  # Python hooks. Ruff and ty come from the pyproject dev group (uv.lock) via `uv run`,
  # so they use the project venv. Definitions mirror astral-sh/ruff-pre-commit.
  - repo: local
    hooks:
      # Run the linter.
      - id: ruff-check
        name: ruff check
        entry: uv run --only-group dev ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--exit-non-zero-on-fix"]
        require_serial: true
        always_run: true
        priority: 10
      # Run the formatter.
      - id: ruff-format
        name: ruff format
        entry: uv run --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
      # Check the uv lockfile (uv is pinned in mise.toml).
      - id: uv-lock
        name: uv-lock
        entry: uv lock --check
        language: system
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false
        always_run: true
        priority: 10
      # Run ty type checker.
      - id: ty
        name: Type check py
        language: system
        types: [python]
        pass_filenames: false
        entry: uv run ty check
        priority: 10
  # Rust hooks
  - repo: local
    hooks:
      - id: rustfmt
        name: Rustfmt
        entry: cargo fmt
        language: system
        types: [rust]
        args: ["--all", "--check"]
        pass_filenames: false
      - id: cargo-check
        name: Cargo Check
        entry: cargo check
        language: system
        types: [rust]
        args: ["--workspace", "--all-features", "--locked"]
        pass_filenames: false
        priority: 10
      - id: clippy
        name: Clippy
        entry: cargo clippy
        language: system
        types: [rust]
        args:
          ["--workspace", "--all-features", "--locked", "--", "-D", "warnings"]
        pass_filenames: false
