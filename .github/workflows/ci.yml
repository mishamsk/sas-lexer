name: Dev CI (lint, format, test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Rust linting / formatting.
  cargo-fmt:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt-check

  cargo-clippy:
    name: "cargo clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The runner's default Python (3.14) is newer than PyO3 0.22 supports.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: "Clippy"
        run: just clippy

  cargo-udeps:
    name: "cargo udeps"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The runner's default Python (3.14) is newer than PyO3 0.22 supports.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-30
      - name: "Install cargo udeps"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps,just
      - name: "Udeps release"
        run: just udeps

  msrv:
    name: "Check MSRV"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install Rust
      uses: ./.github/actions/setup-rust
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack,just
    - name: Default features
      run: just msrv

  # Rust tests for supported platforms.
  test-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: nightly
            os: ubuntu-latest
            rust: nightly
          - build: macos
            os: macos-latest
            rust: stable
          - build: win
            os: windows-latest
            rust: stable
    env:
      TEST_TARGET: ${{ matrix.build == 'stable' && 'all-targets' || 'lib' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # matrix.rust only keeps the job/check names stable: "stable" entries use
      # the compiler pinned in rust-toolchain.toml.
      - name: Install Rust (pinned)
        if: matrix.rust == 'stable'
        uses: ./.github/actions/setup-rust
      # rust-toolchain.toml would override the nightly default, so also select
      # the dated nightly via RUSTUP_TOOLCHAIN for the following steps.
      - name: Install Rust (pinned nightly)
        if: matrix.rust == 'nightly'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-30
      - name: Select pinned nightly
        if: matrix.rust == 'nightly'
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=nightly-2025-12-30" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Basic build
        run: just build
      - name: Build docs
        run: just doc
      # Doc tests, then tests with default features, then with macro_sep, serde.
      - name: Tests
        run: just test-rust ${{ env.TEST_TARGET }}

  # Python linting / formatting.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Lint and check formatting with Ruff
        run: just ruff

  # Python tests.
  test-python:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust
        uses: ./.github/actions/setup-rust
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Sync, build project & run tests
        run: just test-python-ci
