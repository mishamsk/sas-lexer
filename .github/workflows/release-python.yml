name: Test, build, publish to PyPI & release Python package

on:
  push:
    tags:
      - "py-v*"

jobs:
  # The tag must match the package version in pyproject.toml.
  validate-version:
    name: Validate version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check pyproject.toml version matches tag
        run: |
          version=${GITHUB_REF#refs/tags/py-v}
          pyproject_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          echo "Tag: $version, pyproject.toml: $pyproject_version"
          test "$version" = "$pyproject_version" || { echo "::error::tag py-v$version does not match pyproject.toml version $pyproject_version"; exit 1; }

  test:
    needs: validate-version
    uses: ./.github/workflows/ci.yml

  build-wheels:
    needs: test
    uses: ./.github/workflows/build-py-wheels.yml

  pypi-publish:
    name: Upload to PyPI
    needs: [test, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      # For the checkout step.
      contents: read
      # For PyPI's trusted publishing.
      id-token: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      # Only mise.toml is needed: it pins uv.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
      # uv only (pinned in mise.toml), not the other dev tools.
      - uses: jdx/mise-action@v5
        with:
          install_args: uv
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "wheels/*"
      - name: Publish to PyPi
        run: uv publish -v wheels/*

  release:
    name: Create Release
    needs: [test, build-wheels, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/py-v}" >> $GITHUB_OUTPUT
        shell: bash

      - uses: actions/checkout@v7

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: error
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG-PY.md

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true

      - name: create github release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: ${{ steps.changelog_reader.outputs.changes }}
          files: wheels/*
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
