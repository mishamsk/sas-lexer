# Build wheels for sas-lexer on all supported platforms for PyPI publishing.
name: "Build wheels"

on:
  workflow_call:
    inputs:
      dev-number:
        description: >-
          TestPyPI builds only: build <version>.dev<dev-number> (PEP 440) instead of the committed
          version, so each TestPyPI upload is new. Empty (the default, and always for production
          releases) builds the committed version unchanged.
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE_NAME: sas_lexer
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  # Matches the build-system floor in pyproject.toml (maturin>=1.16,<2.0).
  MATURIN_VERSION: "1.16.0"

jobs:
  define-py-matrix:
    runs-on: ubuntu-latest
    outputs:
      py-matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      # Supported CPython minors, one wheel per minor and platform. Keep in sync with
      # requires-python and the classifiers in pyproject.toml.
      - name: Set up Python matrix
        id: matrix
        run: |
          echo 'matrix=["3.11", "3.12", "3.13", "3.14", "3.15"]' >> "$GITHUB_OUTPUT"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The sdist does not link against Python; 3.11 is the oldest supported minor, so the
      # source build and install below are tested on it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: "Set the TestPyPI dev version"
        if: inputs.dev-number
        shell: bash
        env:
          DEV_NUMBER: ${{ inputs.dev-number }}
        run: python -I .github/scripts/release.py dev "$DEV_NUMBER"
      - name: "Build sdist"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      # Builds the extension from the sdist alone (Rust from its rust-toolchain.toml).
      - name: "Test sdist"
        run: sh .github/scripts/test-built-package.sh python 3.11 dist/${{ env.MODULE_NAME }}-*.tar.gz
      - name: "Upload sdist"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: define-py-matrix
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target == 'x86_64' && 'x64' || 'arm64' }}
      - name: "Set the TestPyPI dev version"
        if: inputs.dev-number
        shell: bash
        env:
          DEV_NUMBER: ${{ inputs.dev-number }}
        run: python -I .github/scripts/release.py dev "$DEV_NUMBER"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: "true"
      - name: "Test wheel"
        run: sh .github/scripts/test-built-package.sh python ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  windows:
    runs-on: windows-latest
    needs: define-py-matrix
    strategy:
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # - target: i686-pc-windows-msvc
          #   arch: x86
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.arch }}
      - name: "Set the TestPyPI dev version"
        if: inputs.dev-number
        shell: bash
        env:
          DEV_NUMBER: ${{ inputs.dev-number }}
        run: python -I .github/scripts/release.py dev "$DEV_NUMBER"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: 'true'
      - name: "Test wheel"
        shell: bash
        run: sh .github/scripts/test-built-package.sh python ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist


  linux:
    runs-on: ubuntu-latest
    needs: define-py-matrix
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: "Set the TestPyPI dev version"
        if: inputs.dev-number
        shell: bash
        env:
          DEV_NUMBER: ${{ inputs.dev-number }}
        run: python -I .github/scripts/release.py dev "$DEV_NUMBER"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python${{ matrix.python-version }}
          sccache: 'true'
          manylinux: auto
      - name: "Test wheel"
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        run: sh .github/scripts/test-built-package.sh python ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    needs: define-py-matrix
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
        target:
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: "Set the TestPyPI dev version"
        if: inputs.dev-number
        shell: bash
        env:
          DEV_NUMBER: ${{ inputs.dev-number }}
        run: python -I .github/scripts/release.py dev "$DEV_NUMBER"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python${{ matrix.python-version }}
          sccache: 'true'
          manylinux: musllinux_1_2
      # The official python:<minor>-alpine images exist for every supported minor, so no
      # Python/Alpine release map is needed; the script checks the container's minor.
      - name: "Test wheel"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -w /io \
            "python:${{ matrix.python-version }}-alpine" \
            sh .github/scripts/test-built-package.sh python ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist
