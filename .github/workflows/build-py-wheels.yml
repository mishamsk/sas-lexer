# Build wheels for sas-lexer on all supported platforms for PyPI publishing.
name: "Build wheels"

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE_NAME: sas_lexer
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  # Matches the build-system floor in pyproject.toml (maturin>=1.16,<2.0).
  MATURIN_VERSION: "1.16.0"

jobs:
  define-py-matrix:
    runs-on: ubuntu-latest
    outputs:
      py-matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      # Supported CPython minors, one wheel per minor and platform. Keep in sync with
      # requires-python and the classifiers in pyproject.toml.
      - name: Set up Python matrix
        id: matrix
        run: |
          echo 'matrix=["3.11", "3.12", "3.13", "3.14", "3.15"]' >> "$GITHUB_OUTPUT"

  sdist:
    runs-on: ubuntu-latest
    # The sdist does not link against Python. The source build and install are tested on the
    # oldest supported minor.
    env:
      MISE_PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: python
          cache_key: "{{default}}-py3.11"
      - name: "Build sdist"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      # Builds the extension from the sdist alone (Rust from its rust-toolchain.toml).
      - name: "Test sdist"
        run: sh .github/scripts/test-built-package.sh python3 3.11 dist/${{ env.MODULE_NAME }}-*.tar.gz
      - name: "Upload sdist"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: define-py-matrix
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
    # Build and test with the matrix Python, not the mise.toml dev pin.
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      # The matrix Python (MISE_PYTHON_VERSION overrides the mise.toml pin) for the build and
      # the wheel smoke test.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
          cache_key: "{{default}}-py${{ matrix.python-version }}"
      # On macOS maturin-action puts the runner's toolcache Pythons ahead of mise's on PATH, so
      # pass the mise interpreter explicitly (resolved before maturin-action changes PATH).
      - name: "Locate Python"
        id: python
        run: echo "path=$(command -v python3)" >> "$GITHUB_OUTPUT"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i ${{ steps.python.outputs.path }}
          sccache: "true"
      - name: "Test wheel"
        run: sh .github/scripts/test-built-package.sh "${{ steps.python.outputs.path }}" ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  windows:
    runs-on: windows-latest
    needs: define-py-matrix
    strategy:
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # - target: i686-pc-windows-msvc
          #   arch: x86
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
    # Build and test with the matrix Python, not the mise.toml dev pin.
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      # The matrix Python (MISE_PYTHON_VERSION overrides the mise.toml pin) for the build and
      # the wheel smoke test.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
          cache_key: "{{default}}-py${{ matrix.python-version }}"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: 'true'
      - name: "Test wheel"
        shell: bash
        run: sh .github/scripts/test-built-package.sh python ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist


  linux:
    runs-on: ubuntu-latest
    needs: define-py-matrix
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
        target:
          - x86_64-unknown-linux-gnu
    # Build and test with the matrix Python, not the mise.toml dev pin.
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      # The matrix Python (MISE_PYTHON_VERSION overrides the mise.toml pin) for the build and
      # the wheel smoke test.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
          cache_key: "{{default}}-py${{ matrix.python-version }}"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python${{ matrix.python-version }}
          sccache: 'true'
          manylinux: auto
      - name: "Test wheel"
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        run: sh .github/scripts/test-built-package.sh python3 ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    needs: define-py-matrix
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
        target:
          - x86_64-unknown-linux-musl
    steps:
      # No host Python: the build runs in maturin-action's musllinux container and the smoke
      # test in the official python:<minor>-alpine image.
      - uses: actions/checkout@v7
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python${{ matrix.python-version }}
          sccache: 'true'
          manylinux: musllinux_1_2
      # The official python:<minor>-alpine images exist for every supported minor, so no
      # Python/Alpine release map is needed; the script checks the container's minor.
      - name: "Test wheel"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -w /io \
            "python:${{ matrix.python-version }}-alpine" \
            sh .github/scripts/test-built-package.sh python ${{ matrix.python-version }} dist/*.whl
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist
