# Build wheels for sas-lexer on all supported platforms for PyPI publishing.
name: "Build wheels"

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: sas-lexer
  MODULE_NAME: sas_lexer
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  define-py-matrix:
    runs-on: ubuntu-latest
    outputs:
      py-matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Set up Python matrix
        id: matrix
        run: |
          echo 'matrix=["3.10", "3.11", "3.12"]' >> "$GITHUB_OUTPUT"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The sdist does not link against Python, so the mise.toml dev Python is fine.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
      - name: "Build sdist"
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: "Test sdist"
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install dist/${{ env.MODULE_NAME }}-*.tar.gz --force-reinstall
          python -c "import ${{ env.MODULE_NAME }}; print(${{ env.MODULE_NAME }}.__version__)"
      - name: "Upload sdist"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: define-py-matrix
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
    # Build and test with the matrix Python, not the mise.toml dev pin.
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      # The matrix Python (MISE_PYTHON_VERSION overrides the mise.toml pin) for the build and
      # the wheel smoke test.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
          cache_key: "{{default}}-py${{ matrix.python-version }}"
      # On macOS maturin-action puts the runner's toolcache Pythons ahead of mise's on PATH, so
      # pass the mise interpreter explicitly (resolved before maturin-action changes PATH).
      - name: "Locate Python"
        id: python
        run: echo "path=$(command -v python3)" >> "$GITHUB_OUTPUT"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i ${{ steps.python.outputs.path }}
          sccache: "true"
      - name: "Test wheel"
        run: |
          set -e
          "${{ steps.python.outputs.path }}" -m venv .venv
          source .venv/bin/activate
          pip install ${{ env.PACKAGE_NAME }} --find-links dist --force-reinstall
          python -c "import ${{ env.MODULE_NAME }}; print(${{ env.MODULE_NAME }}.__version__)"
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  windows:
    runs-on: windows-latest
    needs: define-py-matrix
    strategy:
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # - target: i686-pc-windows-msvc
          #   arch: x86
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
    # Build and test with the matrix Python, not the mise.toml dev pin.
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      # The matrix Python (MISE_PYTHON_VERSION overrides the mise.toml pin) for the build and
      # the wheel smoke test.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
          cache_key: "{{default}}-py${{ matrix.python-version }}"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: 'true'
      - name: "Test wheel"
        shell: bash
        run: |
          set -e
          python -m venv .venv
          source .venv/Scripts/activate
          pip install ${{ env.PACKAGE_NAME }} --find-links dist --force-reinstall
          python -c "import ${{ env.MODULE_NAME }}; print(${{ env.MODULE_NAME }}.__version__)"
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist


  linux:
    runs-on: ubuntu-latest
    needs: define-py-matrix
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.define-py-matrix.outputs.py-matrix) }}
        target:
          - x86_64-unknown-linux-gnu
    # Build and test with the matrix Python, not the mise.toml dev pin.
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      # The matrix Python (MISE_PYTHON_VERSION overrides the mise.toml pin) for the build and
      # the wheel smoke test.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
          cache_key: "{{default}}-py${{ matrix.python-version }}"
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python${{ matrix.python-version }}
          sccache: 'true'
          manylinux: auto
      - name: "Test wheel"
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install ${{ env.PACKAGE_NAME }} --find-links dist --force-reinstall
          python -c "import ${{ env.MODULE_NAME }}; print(${{ env.MODULE_NAME }}.__version__)"
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    needs: define-py-matrix
    strategy:
      matrix:
        python:
          - version: "3.10"
            alpine: "3.17"
          - version: "3.11"
            alpine: "3.19"
          - version: "3.12"
            alpine: "3.20"
        target:
          - x86_64-unknown-linux-musl
    steps:
      # No host Python: the build runs in maturin-action's musllinux container and the smoke
      # test in Alpine.
      - uses: actions/checkout@v7
      - name: "Build wheels"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python${{ matrix.python.version }}
          sccache: 'true'
          manylinux: musllinux_1_2
      - name: "Test wheel"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: addnab/docker-run-action@v3
        with:
          image: alpine:${{ matrix.python.alpine }}
          options: -v ${{ github.workspace }}:/io -w /io
          run: |
            set -e
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install ${{ env.PACKAGE_NAME }} --find-links dist --force-reinstall
            python -c "import ${{ env.MODULE_NAME }}; print(${{ env.MODULE_NAME }}.__version__)"
      - name: "Upload wheels"
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.python.version }}
          path: dist
