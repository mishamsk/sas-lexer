name: Publish to Test PyPI

on:
  workflow_dispatch:

jobs:
  build-wheels:
    uses: ./.github/workflows/build-py-wheels.yml

  pypi-publish:
    name: Upload to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      # Only mise.toml is needed: it pins uv.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
      # uv only (pinned in mise.toml), not the other dev tools.
      - uses: jdx/mise-action@v5
        with:
          install_args: uv
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Publish to PyPi
        run: uv publish -v --publish-url https://test.pypi.org/legacy/ wheels/*
