# Non-Python CLI tools used by the justfile recipes (locally and in CI), plus uv.
# just and mise themselves are prerequisites and are not pinned here.
# Rust toolchain: rust-toolchain.toml. Python tools (ruff, ty, pytest): pyproject dev group / uv.lock.
[tools]
uv = "0.9.20"
prek = "latest"
typos = "1.52.2"
hyperfine = "2.0.0"
"github:taiki-e/cargo-hack" = "0.6.46"
"github:est31/cargo-udeps" = "0.1.61"
